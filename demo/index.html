<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NMAG Website Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=Inter:wght@400;600;700&family=Merriweather:wght@400;700&family=Poppins:wght@400;600;700&display=swap">
<style>
/* Layout: GPHA template — official banner, masthead, sticky nav, sectioned homepage, hash-routed pages, /admin customizer */
:root{
  --primary:#8E1F17;       /* clay red (Night & Ochre) */
  --primary-ink:#fff;
  --accent:#C9A23F;        /* seal gold, toned to antique gold */
  --accent-ink:#1A120B;
  --ink:#1E1611;           /* seal black, warmed */
  --ink-2:#2B2019;         /* raised ink surface */
  --ochre:#E3C792;         /* seal gold, earthed */
  --ochre-2:#EBD9B4;
  --bg:#F4EDE0;            /* sand */
  --surface:#FBF7EF;
  --sunk:#EFE4D1;
  --fg:#2A1F17;
  --muted:#6B5C4E;
  --line:#DCCDB4;
  --hero-a:#EBD9B4;--hero-b:#E3C792;--hero-fg:#2A1F17;--hero-muted:#5E4E40;
  --hi-text:#8E1F17;       /* red text on light; ochre in dark */
  --on-ink:#F3E9D8;        /* text on ink */
  --on-ink-muted:#C9BBA6;
  --success:#1F7A3D; --warning:#B26A00; --danger:#B42318;
  --radius:.5rem;
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-sans:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --base:16px;
}
:root,:root[data-theme="dark"]{color-scheme:light} /* site always shows light mode */

*{box-sizing:border-box}
html{font-size:var(--base);scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:1rem;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--hi-text)}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.5rem 1rem;z-index:99}
.skip:focus{left:8px}

/* kundu-drum zigzag — the black/white border from the NMAG seal */
.zig{height:8px;background:
  linear-gradient(135deg,var(--ink) 25%,transparent 25%) -4px 0/8px 8px,
  linear-gradient(225deg,var(--ink) 25%,transparent 25%) -4px 0/8px 8px,
  linear-gradient(315deg,var(--ink) 25%,transparent 25%) 0 0/8px 8px,
  linear-gradient(45deg,var(--ink) 25%,transparent 25%) 0 0/8px 8px, color-mix(in srgb,var(--ochre) 80%,var(--accent))}

/* demo ribbon */
.demo{background:var(--sunk);color:var(--muted);font-size:.8rem;font-weight:600;border-bottom:1px solid var(--line)}
.demo a{color:var(--hi-text)}
.demo .wrap{display:flex;gap:.75rem;align-items:center;justify-content:space-between;padding-block:.35rem;flex-wrap:wrap}
.demo a{font-weight:700}

/* official banner */
.official{background:var(--ink);color:var(--on-ink-muted);font-size:.8rem;border-bottom:1px solid var(--ink-2)}
.official .wrap{display:flex;justify-content:space-between;gap:1rem;padding-block:.4rem;flex-wrap:wrap}
.official button{background:none;border:1px solid #4A3D32;color:var(--on-ink);border-radius:999px;padding:.1rem .7rem;font:inherit;cursor:pointer}
.official button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* masthead */
.mast{background:var(--ink);color:var(--on-ink);border-bottom:1px solid #3A2F26}
.mast .wrap{display:flex;align-items:center;gap:1rem;padding-block:1rem}
.mast img{display:block}
.mast .emb,.mast .seal{width:92px;height:92px;object-fit:contain;flex:none}
.mast .seal{width:92px;height:92px}
.mast .name{flex:1;min-width:0;container-type:inline-size}
.mast .name small{display:block;color:var(--on-ink-muted);font-size:.92rem;letter-spacing:.06em;text-transform:uppercase}
.mast .name strong{font-family:var(--font-display);font-size:clamp(.7rem,5.8cqi,2.15rem);font-weight:800;display:block;line-height:1.15;white-space:nowrap}
.mast .name em{font-style:normal;color:#fff}
.search{display:flex;border:1px solid #3A2F26;border-radius:var(--radius);overflow:hidden;background:var(--ink-2)}
.search input::placeholder{color:var(--on-ink-muted)}
.search input{border:0;background:transparent;padding:.5rem .75rem;font:inherit;color:var(--on-ink);width:200px}
.search button{border:0;background:var(--primary);color:var(--primary-ink);padding:0 .8rem;cursor:pointer;font:inherit;font-weight:600}
@media (max-width:820px){.mast .search{display:none}.mast .emb{width:60px;height:60px}.mast .seal{width:60px;height:60px}}
@media (max-width:600px){.mast .wrap{gap:.6rem;padding-block:.75rem}.mast .emb{width:46px;height:46px}.mast .seal{width:46px;height:46px}.mast .name small:last-child{display:none}.mast .name small{font-size:.74rem}}

/* nav */
nav.main{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--primary);color:var(--primary-ink);border-bottom:2px solid var(--ochre);box-shadow:0 6px 18px -12px rgba(30,22,17,.6)}
nav.main .wrap{display:flex;align-items:center;gap:.25rem;overflow-x:auto;scrollbar-width:none}
nav.main a{text-decoration:none;padding:.8rem .85rem;font-weight:600;white-space:nowrap;font-size:.95rem;border-bottom:3px solid transparent}
nav.main a[aria-current="page"]{border-bottom-color:var(--ochre)}
nav.main a:hover{background:rgba(0,0,0,.16)}
nav.main a{opacity:.92}nav.main a[aria-current="page"],nav.main a:hover{opacity:1}
nav.main .adm{margin-left:auto;background:rgba(0,0,0,.22);color:var(--accent);opacity:1}

.announce{background:var(--sunk);border-bottom:1px solid var(--line);font-size:.92rem}
.announce .wrap{display:flex;gap:.75rem;align-items:center;padding-block:.55rem}
.announce b{background:transparent;color:var(--hi-text);border:1px solid var(--hi-text);padding:.05rem .5rem;border-radius:var(--radius);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.announce span{flex:1;min-width:0}
.announce button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:var(--radius);padding:.6rem 1.1rem;font:inherit;font-weight:700;cursor:pointer;border:2px solid transparent;text-decoration:none}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-outline{border-color:currentColor;background:transparent;color:inherit}
.btn-sm{padding:.35rem .7rem;font-size:.85rem}

/* hero */
.hero{position:relative;color:var(--hero-fg);overflow:hidden;background:linear-gradient(120deg,var(--hero-a),var(--hero-b))}
.hero .slide{display:grid;grid-template-columns:1.2fr .8fr;gap:2rem;align-items:center;padding-block:clamp(2.5rem,6vw,4.5rem)}
.hero h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--hi-text)}
.hero p{max-width:52ch;color:var(--hero-muted);font-size:1.1rem;margin:1rem 0 1.5rem}
.hero .art{aspect-ratio:1;max-width:min(100%,420px);justify-self:center;width:100%;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,#F7EEDC 0 44%,var(--accent) 44.3% 45.6%,var(--primary) 45.9% 60%,var(--accent) 60.3% 61.2%,transparent 61.5%),
  repeating-conic-gradient(var(--ink) 0 6deg,var(--ochre) 6deg 12deg);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 30%,transparent),0 30px 50px -24px rgba(42,31,23,.55)}
.hero .art::after{content:"";position:absolute;inset:7%;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent)}
.hero .art img{width:58%;position:relative;z-index:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hero .dots{display:flex;gap:.5rem;padding-bottom:1.5rem}
.hero .dots button{width:34px;height:4px;border:0;border-radius:2px;background:color-mix(in srgb,var(--hero-fg) 25%,transparent);cursor:pointer}
.hero .dots button[aria-current="true"]{background:var(--primary)}
.hero .tag{display:inline-block;border:1px solid color-mix(in srgb,var(--hi-text) 50%,transparent);letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;font-weight:700;border-radius:999px;padding:.15rem .7rem;font-size:.8rem;margin-bottom:1rem;color:var(--hi-text)}
.hero .art.photo{background:repeating-conic-gradient(var(--ink) 0 6deg,var(--ochre) 6deg 12deg)}
.hero .art.photo::after{inset:5.5%;border:3px solid var(--accent)}
.hero .art.photo img{width:89%;height:89%;object-fit:cover;border-radius:50%;filter:none;background:var(--sunk)}
.himg{display:grid;grid-template-columns:96px 1fr;gap:.9rem;align-items:center;grid-column:1/-1;padding:.75rem;border:1px dashed var(--line);border-radius:var(--radius);background:var(--bg)}
.himg .pv{width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--sunk);border:2px solid var(--accent)}
.himg .acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.himg small{display:block;color:var(--muted);font-size:.82rem;margin-top:.35rem}
.himg input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.card .cov.hasimg{background:var(--sunk)}
.card .cov img,.himg .pv.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .cov .pill{position:relative;z-index:1}
.himg .pv.sq{width:128px;height:72px;border-radius:var(--radius);position:relative;overflow:hidden;padding:0}
.himg:has(.pv.sq){grid-template-columns:128px 1fr}
.exed{display:grid;gap:1rem}
.welcome .portrait.hasimg{overflow:hidden;background:var(--sunk);box-shadow:0 0 0 3px var(--accent)}
.welcome .portrait.hasimg img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.himg .pv.oval{width:77px;height:96px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(165deg,var(--primary),var(--ink));color:var(--accent);font-family:var(--font-display);font-weight:800;font-size:1.4rem;justify-self:center}
.himg .pv.oval img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.exitem{border:1px solid var(--line);border-radius:var(--radius);padding:1rem;background:var(--surface)}
@media (max-width:480px){.himg:has(.pv.sq){grid-template-columns:1fr}.himg{grid-template-columns:1fr;justify-items:start}}
@media (max-width:760px){.hero .slide{grid-template-columns:1fr}.hero .art{width:60%;margin:auto}}

/* sections */
section.blk{padding-block:clamp(2.5rem,5vw,4rem)}
section.alt{background:var(--sunk)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:1.75rem;flex-wrap:wrap}
.sec-head h2{font-size:clamp(1.5rem,3vw,2.2rem);margin-top:.3rem}
.sec-head p{color:var(--muted);max-width:60ch;margin:.4rem 0 0}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.kpi{padding:1.25rem 1.4rem;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .n{font-family:var(--font-display);font-size:2.2rem;font-weight:800;color:var(--hi-text);font-variant-numeric:tabular-nums;line-height:1}
.kpi .l{color:var(--muted);font-size:.9rem;margin-top:.35rem}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

.welcome{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:start}
.welcome .portrait{width:190px;max-width:100%;aspect-ratio:4/5;border-radius:50%;background:linear-gradient(165deg,var(--primary),color-mix(in srgb,var(--primary) 30%,var(--ink)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 50%,transparent);display:grid;place-items:center;color:var(--accent);font-family:var(--font-display);font-size:3rem;font-weight:800}
.welcome blockquote{margin:0;font-size:1.15rem;max-width:62ch}
.welcome cite{display:block;margin-top:1rem;font-style:normal;color:var(--muted)}
@media (max-width:640px){.welcome{grid-template-columns:1fr}}

.grid{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);transition:box-shadow .2s,transform .2s;border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card:hover{box-shadow:0 10px 24px -14px rgba(30,22,17,.45);transform:translateY(-2px)}
.card .cov{aspect-ratio:16/9;max-width:100%;position:relative;display:flex;align-items:end;padding:.75rem}
.card .body{padding:1rem 1.1rem 1.2rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.card h3{font-size:1.15rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.card .meta{font-size:.82rem;color:var(--muted);margin-top:auto;padding-top:.4rem;display:flex;gap:.75rem;flex-wrap:wrap}
.pill{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .55rem;border-radius:999px;background:var(--surface);color:var(--fg)}
.pill{box-shadow:0 1px 2px rgba(0,0,0,.15)}.pill.on{background:#2E6B45;color:#fff}.pill.soon{background:var(--ochre);color:#2A1F17}.pill.past{background:#6E6155;color:#fff}

/* cover art variants */
.cv0{background:repeating-linear-gradient(135deg,var(--primary) 0 16px,color-mix(in srgb,var(--primary) 80%,#000) 16px 32px)}
.cv1{background:radial-gradient(circle at 72% 45%,var(--accent) 0 20%,transparent 20.5%),radial-gradient(circle at 72% 45%,transparent 0 26%,color-mix(in srgb,var(--accent) 40%,transparent) 26.5% 27.5%,transparent 28%),linear-gradient(135deg,var(--ink-2),var(--ink))}
.cv2{background:linear-gradient(135deg,var(--primary) 25%,transparent 25%) -18px 0/36px 36px,linear-gradient(225deg,var(--primary) 25%,transparent 25%) -18px 0/36px 36px,linear-gradient(315deg,var(--primary) 25%,transparent 25%) 0 0/36px 36px,linear-gradient(45deg,var(--primary) 25%,transparent 25%) 0 0/36px 36px,color-mix(in srgb,var(--primary) 70%,var(--ink))}
.cv3{background:linear-gradient(180deg,transparent 62%,var(--ink) 62%),repeating-linear-gradient(90deg,#EFE3C8 0 12px,color-mix(in srgb,var(--accent) 75%,#EFE3C8) 12px 24px)}
.cv4{background:radial-gradient(circle,color-mix(in srgb,var(--accent) 70%,transparent) 14%,transparent 15%) 0 0/24px 24px,linear-gradient(160deg,color-mix(in srgb,var(--primary) 70%,var(--ink)),var(--ink))}
.cv5{background:repeating-conic-gradient(var(--ink) 0 25%,#EFE3C8 0 50%) 0 0/20px 20px;box-shadow:inset 0 -40px 40px -20px rgba(0,0,0,.35)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.list li{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.list li span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

.newsletter{background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 85%,#000),var(--primary));color:var(--primary-ink);border-top:2px solid var(--accent)}
.newsletter .wrap{display:flex;gap:1.5rem;align-items:center;justify-content:space-between;padding-block:1.75rem;flex-wrap:wrap}
.newsletter form{display:flex;gap:.5rem;flex-wrap:wrap}
.newsletter input{padding:.6rem .8rem;border-radius:var(--radius);border:0;font:inherit;min-width:0;width:240px;max-width:100%}

/* page header */
.ph{color:var(--hero-fg);background:linear-gradient(120deg,var(--hero-a),var(--hero-b))}
.ph .wrap{padding-block:2.5rem}
.ph h1{font-size:clamp(1.8rem,4vw,2.8rem);margin-top:.4rem}
.ph p{color:var(--hero-muted);max-width:60ch;margin:.6rem 0 0}
.crumb{font-size:.85rem;color:var(--hero-muted)}

/* filters */
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}
.filters input,.filters select{padding:.5rem .7rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:.3rem .85rem;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

.prose{max-width:70ch}
.prose p{margin:0 0 1rem}
.form{display:grid;gap:.9rem;max-width:560px}
.form label{font-weight:600;font-size:.9rem;display:grid;gap:.3rem}
.form input,.form textarea,.form select{padding:.6rem .75rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit}

/* footer */
footer{background:var(--ink);color:var(--on-ink-muted);font-size:.92rem}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem;padding-block:2.5rem}
footer h4{color:var(--accent);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.75rem}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:.35rem}
footer a{text-decoration:none}footer a:hover{color:#fff;text-decoration:underline}
footer .legal{border-top:1px solid #3A2F26}
footer .legal .wrap{display:flex;justify-content:space-between;gap:1rem;padding-block:1rem;flex-wrap:wrap;font-size:.82rem}
@media (max-width:760px){footer .cols{grid-template-columns:1fr 1fr}}

.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:.5rem;align-items:end}
.fab button{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;font-size:1.2rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab .chat{background:var(--primary);color:var(--primary-ink)}
.fab .top{background:var(--ink);color:var(--accent)}
.chatbox{width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.chatbox header{background:var(--primary);color:var(--primary-ink);padding:.6rem .9rem;font-weight:700}
.chatbox .msgs{padding:.75rem;display:grid;gap:.5rem;max-height:220px;overflow:auto;font-size:.9rem}
.chatbox .msgs .flash{animation:msgflash 1.2s ease}@keyframes msgflash{0%,40%{background:color-mix(in srgb,var(--ochre) 55%,transparent)}100%{background:transparent}}
.chatbox .msgs>div{border-radius:6px;padding:.15rem .3rem}
.chatbox .q{display:grid;gap:.4rem;padding:0 .75rem .75rem}
.fab .chatbox .q .chip{width:100%;height:auto;display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--fg);font:inherit;font-size:.92rem;font-weight:600;text-align:left;box-shadow:none;line-height:1.2}
.fab .chatbox .q .chip[aria-pressed="true"]{border-color:var(--primary);background:var(--sunk);box-shadow:inset 3px 0 0 var(--primary)}
.fab .chatbox .q .chip:hover{border-color:var(--primary);background:var(--sunk)}
.fab .chatbox .q .chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.chatbox .q .ic{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-ink)}
.chatbox .q .ic svg{width:15px;height:15px}
.chat-ic-pv{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-ink)}
.chat-ic-pv svg{width:16px;height:16px}
.chat-row{display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;align-items:end}
@media (max-width:520px){.chat-row{grid-template-columns:1fr auto}.chat-row label:nth-child(2){grid-column:1}.chat-row button{grid-row:1;grid-column:2}}
.chat-pv{grid-column:1/-1;background:var(--sunk);border-left:3px solid var(--primary);border-radius:var(--radius);padding:.6rem .8rem;font-size:.9rem}
.chat-pv span{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.2rem}
.chat-pv small{display:block;margin-top:.25rem;color:var(--muted);font-size:.88rem}

/* maintenance */
/* maintenance / coming soon — "Closed for Rehanging" */
.gate{min-height:calc(100vh - 34px);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse 60% 70% at 50% 42%,#3A2A1F 0,transparent 70%),linear-gradient(180deg,var(--ink-2),var(--ink));color:var(--on-ink);
  padding-block:3.5rem 5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gate .ring{width:270px;max-width:68vw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:2rem}
.gate .ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ochre),#F1DDB0,var(--accent),#F1DDB0,var(--ochre),#F1DDB0,var(--accent),#F1DDB0,var(--ochre));
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 58.5%);mask:radial-gradient(circle,transparent 58%,#000 58.5%);animation:gate-spin 60s linear infinite}
.gate .ring::after{content:"";position:absolute;inset:14%;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent)}
.gate .ring img{width:62%;border-radius:50%;position:relative}
@keyframes gate-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.gate .ring::before{animation:none}}
.gate .eb{color:var(--ochre);letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;font-weight:700}
.gate h1{font-size:clamp(2rem,5vw,3.4rem);margin:.7rem 0 .8rem;color:#fff}
.gate p{max-width:48ch;color:var(--on-ink-muted);margin:0 auto;font-size:1.08rem}
.gate .tp{font-style:italic;opacity:.85;margin-top:.6rem}
.gate .rule{width:72px;height:2px;background:var(--accent);margin:1.6rem auto}
.gate .meta{display:flex;gap:2.75rem;justify-content:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.gate .meta b{display:block;color:var(--ochre);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.2rem}
.gate .meta .big{font-family:var(--font-display);font-size:2rem;font-weight:800;color:#fff;line-height:1}
.gate .foot{position:absolute;left:0;right:0;bottom:0;padding-block:.8rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:.8rem;color:var(--on-ink-muted);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-top:1px solid #3A2F26}
.gate .foot a{color:var(--ochre)}

/* ---------- ADMIN ---------- */
.admin{display:grid;grid-template-columns:240px 1fr;min-height:100vh;background:var(--bg)}
.admin aside{background:var(--ink);color:#D9CCB4;padding:1rem 0;position:sticky;top:0;height:100vh;overflow:auto}
.admin aside .brand{display:flex;gap:.6rem;align-items:center;padding:0 1rem 1rem;border-bottom:1px solid #3A3027;margin-bottom:.5rem}
.admin aside .brand img{width:38px}
.admin aside .brand b{color:#fff;font-family:var(--font-display);line-height:1.1}
.admin aside button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:.55rem 1rem;font:inherit;cursor:pointer;border-left:3px solid transparent}
.admin aside button[aria-current="true"]{background:#2A2119;color:#fff;border-left-color:var(--accent)}
.admin aside .grp{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#8C7E6C;padding:.9rem 1rem .3rem}
.admin main{padding:1.5rem max(16px,env(safe-area-inset-right,0px)) 3rem 1.5rem;min-width:0}
.admin .top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.admin .top h1{font-size:1.6rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem}
.panel h2{font-size:1.1rem;margin-bottom:.9rem}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.fields label,.fl{display:grid;gap:.3rem;align-content:start;font-size:.85rem;font-weight:600}
.fields input,.fields select,.fields textarea,.fl input,.fl textarea,.fl select{padding:.5rem .65rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg);font:inherit;font-weight:400}
.fields input[type=color]{padding:2px;height:40px}
.swatches{display:flex;gap:.4rem;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.rows{display:grid;gap:.4rem}
.row{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg)}
.row .t{flex:1;min-width:0}
.row button{background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--fg);padding:.2rem .5rem;font:inherit;font-size:.85rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tblwrap{overflow-x:auto}
.tbl th,.tbl td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:var(--radius);z-index:100;border-left:4px solid var(--accent)}
.preview-frame{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.mini{display:flex;align-items:center;gap:.6rem;padding:.6rem;background:var(--primary);color:var(--primary-ink);font-weight:700;font-family:var(--font-display)}
.mini+div{padding:.8rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
@media (max-width:820px){.admin{grid-template-columns:1fr}.admin aside{position:static;height:auto;display:flex;overflow-x:auto;padding:.5rem}.admin aside .brand,.admin aside .grp{display:none}.admin aside button{white-space:nowrap;width:auto;border-left:0;border-bottom:3px solid transparent}.admin aside button[aria-current="true"]{border-bottom-color:var(--accent)}.admin main{padding-left:max(16px,env(safe-area-inset-left,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

function shade(hex,amt){let c=hex.replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");const n=parseInt(c,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return"#"+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function inkFor(hex){const n=parseInt(hex.slice(1),16);const L=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255));return L>150?"#1A120B":"#FFFFFF"}
function applyTheme(){const r=document.documentElement.style,i=S.identity;
  r.setProperty("--primary",i.primary);r.setProperty("--primary-ink",inkFor(i.primary));

function render(){
  const r=(location.hash.slice(1)||"home");applyTheme();
  const app=document.getElementById("app");
  if(r==="admin"){app.innerHTML=admin();return}
  if(S.mode.value!=="live"){app.innerHTML=`<div class="demo"><div class="wrap"><span>Site mode is “${S.mode.value}”. Visitors see this screen.</span><a href="#admin">Open the Admin Panel →</a></div></div>`+gate();return}
  const page=PAGES[r]?r:"home";
  app.innerHTML=chrome(page,PAGES[page]());fitTitle();
}
/* shrink the masthead title until it fits on one line */
function fitTitle(){const st=document.querySelector(".mast .name strong");if(!st)return;st.style.fontSize="";
  let fs=parseFloat(getComputedStyle(st).fontSize),n=0;while(st.scrollWidth>st.clientWidth+1&&fs>10&&n++<40){fs-=.5;st.style.fontSize=fs+"px"}}
addEventListener("resize",fitTitle);try{document.fonts.ready.then(fitTitle)}catch(e){}
addEventListener("hashchange",()=>{render();scrollTo({top:0})});
clearInterval(timer);timer=setInterval(()=>{if((location.hash.slice(1)||"home")==="home"&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&!document.querySelector(".hero:hover")){slide=(slide+1)%S.hero.slides.length;const h=document.querySelector(".hero");if(h){h.outerHTML=hero().replace(/<div class="zig"[^>]*><\/div>$/,"")}}},7000);
render();
</script>

</body></html>
